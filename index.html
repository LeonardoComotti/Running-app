/* ============ DETTAGLIO CORSA (a tutto schermo, grafici dal file dell'orologio) ============ */
const COL = {pace:"#2563eb", hr:"#e11d48", alt:"#a16207"};
function smoothPace(tr){   // passo (s/km) su una finestra di ~250 m, per togliere il rumore del GPS
  const out = []; let j = 0;
  for(let i=0;i<tr.d.length;i++){
    while(j < i && tr.d[i]-tr.d[j] > 250) j++;
    const k = Math.max(0, j-1), dd = tr.d[i]-tr.d[k], dt = tr.t[i]-tr.t[k];
    out.push(dd > 50 ? Math.min(900, Math.max(150, dt/dd*1000)) : null);
  }
  return out;
}
const fmtPace = p => p==null ? "–" : `${Math.floor(p/60)}:${String(Math.round(p%60)).padStart(2,"0")}`;
// Fasce di passo dai tuoi ritmi (blocco base o principale, in base alla data della corsa)
function paceBands(date){
  const P = date < BASE_END ? RB : R;
  const rng = s => { const m = s.match(/(\d+):(\d+)\D+(\d+):(\d+)/); return [(+m[1])*60+(+m[2]), (+m[3])*60+(+m[4])]; };
  const V = rng(P.V), Sg = rng(P.S), RMr = rng(P.RM), M = rng(P.M), F = rng(P.F), mid = (a,b) => Math.round((a+b)/2);
  return [
    {n:"Più veloce", lo:0,                  hi:V[0],                 c:"#9f1239"},
    {n:"Ripetute",   lo:V[0],               hi:mid(V[1],Sg[0]),      c:"#ef4444"},
    {n:"Soglia",     lo:mid(V[1],Sg[0]),    hi:mid(Sg[1],RMr[0]),    c:"#f97316"},
    {n:"Ritmo mezza",lo:mid(Sg[1],RMr[0]),  hi:mid(RMr[1],M[0]),     c:"#8b5cf6"},
    {n:"Medio",      lo:mid(RMr[1],M[0]),   hi:mid(M[1],F[0]),       c:"#0ea5e9"},
    {n:"Facile",     lo:mid(M[1],F[0]),     hi:F[1]+15,              c:"#22c55e"},
    {n:"Recupero",   lo:F[1]+15,            hi:1e9,                  c:"#94a3b8"},
  ];
}
function timeInBands(tr, values, bands){
  const acc = bands.map(()=>0);
  for(let i=1;i<tr.t.length;i++){
    const dt = tr.t[i]-tr.t[i-1], v = values[i]; if(v==null || dt<=0 || dt>60) continue;
    const k = bands.findIndex(b => v>=b.lo && v<b.hi); if(k>=0) acc[k] += dt;
  }
  return acc;
}
function zonesCard(title, bands, secs, fmtRange){
  const tot = secs.reduce((a,b)=>a+b,0); if(!tot) return "";
  const rows = bands.map((b,i)=>({...b, s:secs[i]})).filter(b=>b.s>0);
  return `<div class="card"><b>${title}</b>
    <div class="zbar">${rows.map(b=>`<i style="flex:${b.s};background:${b.c}" title="${b.n}"></i>`).join("")}</div>
    ${bands.map((b,i)=>{ const pc = secs[i]/tot*100; return `<div class="zrow ${secs[i]?"":"dim"}"><i style="background:${b.c}"></i><span class="sp"><b>${b.n}</b> <span class="muted">${fmtRange(b)}</span></span>
      <span class="zmin">${fmtDur(secs[i])||"–"}</span><span class="zpc">${pc>=0.5?Math.round(pc)+"%":"–"}</span></div>
      <div class="ztrack"><i style="width:${pc}%;background:${b.c}"></i></div>`; }).join("")}</div>`;
}
function lineChart({id, xs, ys, yFmt, invert, color, bands, area, title, unit}){
  const W = 360, H = 220, l = 38, r = 10, t = 10, b = 22, iw = W-l-r, ih = H-t-b;
  const vals = ys.filter(v=>v!=null); if(vals.length < 2) return "";
  const sorted = [...vals].sort((a,b)=>a-b), q = p => sorted[Math.floor(p*(sorted.length-1))];
  let lo = q(0.02), hi = q(0.98); const pad = (hi-lo)*0.15 || 5; lo -= pad; hi += pad;
  const xmax = xs[xs.length-1] || 1, X = x => l + x/xmax*iw;
  const Y = v => { const f = (Math.min(hi,Math.max(lo,v))-lo)/(hi-lo); return invert ? t + f*ih : t + ih - f*ih; };
  let g = "";
  if(bands) bands.forEach(z => { if(z.hi <= lo || z.lo >= hi) return; const y1 = Y(Math.min(hi,z.hi)), y2 = Y(Math.max(lo,z.lo));
    g += `<rect x="${l}" y="${Math.min(y1,y2)}" width="${iw}" height="${Math.abs(y2-y1)}" fill="${z.c}" opacity=".16"/>`;
    if(Math.abs(y2-y1) > 12) g += `<text x="${W-r-3}" y="${Math.min(y1,y2)+11}" text-anchor="end" style="fill:${z.c};font-weight:700">${z.n}</text>`; });
  [lo+(hi-lo)*0.1, (lo+hi)/2, hi-(hi-lo)*0.1].forEach(v => g += `<line class="grid" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-5}" y="${Y(v)+3}" text-anchor="end">${yFmt(v)}</text>`);
  const pts = xs.map((x,i)=> ys[i]==null ? null : `${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`);
  let path = "", open = false; pts.forEach(pt => { if(!pt){ open=false; return; } path += (open?"L":"M")+pt; open = true; });
  if(area){ const base = t+ih; g += `<path d="M${X(xs[0])},${base}L${pts.filter(Boolean).join("L")}L${X(xs[xs.length-1])},${base}Z" fill="${color}" opacity=".22"/>`; }
  g += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  for(let k=0;k<=Math.floor(xmax/1000);k+= xmax>12000?2:1) g += `<text x="${X(k*1000)}" y="${H-6}" text-anchor="middle">${k}</text>`;
  g += `<line class="cross" x1="0" x2="0" y1="${t}" y2="${t+ih}" stroke="var(--ink)" stroke-width="1.2" opacity="0"/><circle class="dot" r="5" fill="${color}" stroke="var(--card)" stroke-width="2" opacity="0"/>
    <rect class="hit" x="${l}" y="${t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  return `<div class="card chart big" data-chart="${id}"><div class="row"><b class="sp"><i class="sw" style="background:${color}"></i>${title}</b><span class="small muted">${unit}</span></div>
    <svg viewBox="0 0 ${W} ${H}" data-xmax="${xmax}" data-l="${l}" data-iw="${iw}" data-lo="${lo}" data-hi="${hi}" data-t="${t}" data-ih="${ih}" data-inv="${invert?1:0}">${g}</svg>
    <div class="cap">Tocca o trascina sul grafico · asse orizzontale in km</div></div>`;
}
let runCtx = null;
function openRun(id){
  const l = S.log.find(x=>x.id===id); if(!l) return;
  const sec = totalSec(l), p = S.program.find(x=>x.id===l.programId), tr = l.track;
  $("#runTitle").textContent = (l.type||"Corsa");
  $("#runDate").textContent = dayLabel(l.date);
  let h = `${p?`<div class="note">Seduta: <b>${esc(p.session)}</b> · ${esc(p.plan)}</div>`:""}
    <div class="stats">
      <div class="stat"><div class="v">${l.km??"–"}</div><div class="l">km</div></div>
      <div class="stat"><div class="v">${fmtDur(sec)}</div><div class="l">tempo</div></div>
      <div class="stat"><div class="v">${l.km&&sec?pace(sec,l.km).replace("/km",""):"–"}</div><div class="l">min/km</div></div>
      <div class="stat"><div class="v">${l.hrAvg??"–"}</div><div class="l">FC media${l.hrAvg&&zoneOf(l.hrAvg)?.n?" · "+zoneOf(l.hrAvg).n:""}</div></div>
      <div class="stat"><div class="v">${l.hrMax??"–"}</div><div class="l">FC max</div></div>
      <div class="stat"><div class="v">${l.gain!=null?l.gain+" m":(l.rpe??"–")}</div><div class="l">${l.gain!=null?"dislivello +":"sforzo"}</div></div>
    </div>`;
  if((l.pains||[]).length) h += `<div class="note">Dolori: ${esc(painsText(l))}</div>`;
  if(l.notes) h += `<div class="note">${esc(l.notes)}</div>`;
  if(tr){
    const pb = paceBands(l.date), hz = zones().map(z=>({n:z.n, lo:z.lo, hi:z.hi+1, c:z.c, name:z.name}));
    hz[0].lo = 0; hz[hz.length-1].hi = 260;
    runCtx = {tr, pace: smoothPace(tr)};
    h += lineChart({id:"pace", xs:tr.d, ys:runCtx.pace, yFmt:fmtPace, invert:true, color:COL.pace, bands:pb, title:"Passo", unit:"min/km · in alto = più veloce"});
    h += zonesCard("Tempo nelle fasce di passo", pb, timeInBands(tr, runCtx.pace, pb),
      b => b.lo===0 ? `< ${fmtPace(b.hi)}` : b.hi>=1e9 ? `> ${fmtPace(b.lo)}` : `${fmtPace(b.lo)}–${fmtPace(b.hi)}`);
    if(tr.hr){
      h += lineChart({id:"hr", xs:tr.d, ys:tr.hr, yFmt:v=>Math.round(v), color:COL.hr, bands:hz, title:"Frequenza cardiaca", unit:"bpm"});
      h += zonesCard("Tempo nelle zone cardiache", hz.map(z=>({...z, n:`${z.n} ${z.name}`})), timeInBands(tr, tr.hr, hz),
        b => b.lo===0 ? `< ${b.hi}` : b.hi>=260 ? `> ${b.lo}` : `${b.lo}–${b.hi-1}`);
    } else if(!l.hrZonesMin) h += `<div class="card note">Il file esportato da Huawei non contiene la frequenza cardiaca. Puoi inserire a mano i minuti per zona (da «Modifica» → «Tempo nelle zone FC»).</div>`;
    if(tr.alt) h += lineChart({id:"alt", xs:tr.d, ys:tr.alt, yFmt:v=>Math.round(v), color:COL.alt, area:true, title:"Altimetria", unit:"m"});
  }
  if(l.hrZonesMin && !tr?.hr){
    const hz = zones().map(z=>({n:`${z.n} ${z.name}`, lo:z.lo, hi:z.hi+1, c:z.c})); hz[0].lo = 0; hz[4].hi = 260;
    h += zonesCard("Tempo nelle zone cardiache <span class='small muted'>(dall'app Huawei)</span>", hz, l.hrZonesMin.map(m=>m*60), b => b.lo===0 ? `< ${b.hi}` : b.hi>=260 ? `> ${b.lo}` : `${b.lo}–${b.hi-1}`);
  }
  if(l.splits?.length){
    const full = l.splits.filter(s=>!s.part), best = Math.min(...full.map(s=>s.sec)), worst = Math.max(...full.map(s=>s.sec));
    h += `<div class="card"><b>Parziali per km</b><div style="margin-top:8px">${l.splits.map(s => {
      const pk = s.part ? s.sec/s.part*1000 : s.sec, w = worst>best ? 30 + 70*(1-(pk-best)/(worst-best)) : 100;
      return `<div class="row small" style="margin:5px 0"><span style="width:44px">${s.part?s.km+" km":"km "+s.km}</span>
        <span class="sp"><span style="display:block;height:18px;border-radius:5px;width:${Math.max(10,Math.min(100,w))}%;background:${COL.pace};opacity:${pk===best&&!s.part?1:.45}"></span></span>
        <b style="width:44px;text-align:right">${fmtPace(pk)}</b><span class="muted" style="width:58px;text-align:right">${s.hr?s.hr+" bpm":""}</span></div>`; }).join("")}</div></div>`;
  }
  if(!tr && !l.splits) h += `<div class="card note">Per vedere grafici e tempo nelle zone importa il file dell'orologio: «Modifica» → «📂 Compila da file dell'orologio», oppure condividi il file da Huawei Health all'app Corsa.</div>`;
  $("#runBody").innerHTML = h;
  $("#runEdit").onclick = () => { closeRun(); openLog(l); };
  $("#runDlg").showModal(); $("#runDlg").scrollTop = 0;
  history.pushState({run:1}, "");   // il tasto «indietro» di Android chiude il dettaglio
}
function closeRun(){ if($("#runDlg").open){ $("#runDlg").close(); if(history.state?.run) history.back(); } }
$("#runBack").onclick = closeRun;
window.addEventListener("popstate", () => { if($("#runDlg").open) $("#runDlg").close(); });
function runPointer(e){   // tocco o trascinamento sul grafico → linea verticale + valori in quel punto
  const svg = e.target.closest("#runBody svg"); if(!svg || !runCtx) return;
  const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, x = (e.clientX-box.left)/box.width*vb.width;
  const l = +svg.dataset.l, iw = +svg.dataset.iw, xmax = +svg.dataset.xmax, dist = Math.max(0,Math.min(1,(x-l)/iw))*xmax;
  const tr = runCtx.tr; let i = 0; while(i < tr.d.length-1 && tr.d[i] < dist) i++;
  const cx = l + tr.d[i]/xmax*iw;
  $("#runBody").querySelectorAll("svg").forEach(sv => {
    const c = sv.querySelector(".cross"), d = sv.querySelector(".dot"); if(!c) return;
    c.setAttribute("x1",cx); c.setAttribute("x2",cx); c.setAttribute("opacity",".55");
    const id = sv.closest("[data-chart]").dataset.chart, v = id==="pace" ? runCtx.pace[i] : id==="hr" ? tr.hr?.[i] : tr.alt?.[i];
    if(v==null){ d.setAttribute("opacity","0"); return; }
    const lo = +sv.dataset.lo, hi = +sv.dataset.hi, t = +sv.dataset.t, ih = +sv.dataset.ih, f = (Math.min(hi,Math.max(lo,v))-lo)/(hi-lo);
    d.setAttribute("cx", cx); d.setAttribute("cy", sv.dataset.inv==="1" ? t+f*ih : t+ih-f*ih); d.setAttribute("opacity","1");
  });
  const z = tr.hr?.[i] ? zoneOf(tr.hr[i]) : null;
  const txt = `km ${(tr.d[i]/1000).toFixed(2)} · ${fmtDur(tr.t[i])} · passo ${fmtPace(runCtx.pace[i])}${tr.hr?.[i]?` · FC ${tr.hr[i]}${z?.n?" ("+z.n+")":""}`:""}${tr.alt?.[i]!=null?` · ${Math.round(tr.alt[i])} m`:""}`;
  $("#runBody").querySelectorAll(".chart .cap").forEach(c => c.textContent = txt);
}
$("#runBody").addEventListener("pointerdown", runPointer);

});

/* ============ EVENTI ============ */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); scrollTo(0,0); });
$("#fab").onclick = () => openLog(null, null);
$("#view").addEventListener("click", e => {
  const t = e.target.closest("[data-do],[data-editlog],[data-editprog],[data-addprog],[data-day],[data-cal],[data-newev],[data-editev],[data-week],[data-backup],[data-goto],[data-run],[data-goal],[data-newgoal],[data-newgoal-go]"); if(!t) return;
  if(t.dataset.run){ openRun(t.dataset.run); return; }
  if(t.dataset.newgoalGo!==undefined){ tab="coach"; render(); scrollTo(0,0); return; }
  if(t.dataset.goal){ openGoal(S.goals.find(g=>g.id===t.dataset.goal)); return; }
  if(t.dataset.newgoal!==undefined){ openGoal(null); return; }
  if(t.dataset.week){ e.preventDefault(); openWeek(t.dataset.week); return; }
  if(t.dataset.goto){ document.getElementById("blk-"+t.dataset.goto)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(t.dataset.backup!==undefined){ exportJson(); return; }
  if(t.dataset.cal){ const [y,m] = calMonth.split("-").map(Number); const d = new Date(y, m-1+(+t.dataset.cal), 1); calMonth = iso(d).slice(0,7); renderCalendar(); }
  else if(t.dataset.day) openDay(t.dataset.day);
  else if(t.dataset.newev) openEvent(null, t.dataset.newev);
  else if(t.dataset.editev) openEvent(S.events.find(x=>x.id===t.dataset.editev));
  else if(t.dataset.do) openLog(null, S.program.find(p=>p.id===t.dataset.do));
  else if(t.dataset.editlog) openLog(S.log.find(l=>l.id===t.dataset.editlog));
  else if(t.dataset.editprog) openProg(S.program.find(p=>p.id===t.dataset.editprog));
  else if(t.dataset.addprog) openProg(null, t.dataset.addprog);
});

load(); render();
// Arrivo da «Condividi» di un'altra app: importo il file e propongo la seduta giusta
(async () => {
  if(!location.search.includes("shared=1")) return;
  history.replaceState(null, "", location.pathname);
  try{
    const c = await caches.open("corsa-share"), res = await c.match("shared-file");
    const resT = await c.match("shared-text");
    if(!res && resT){   // link condiviso (es. da Strava): apro il modulo con il link pronto
      const txt = await resT.text(); await c.delete("shared-text");
      tab = "programma"; render(); openLog(null, null);
      $("#stravaLink").value = (txt.match(/https?:\/\/\S+/)||[txt])[0];
      $("#importMsg").textContent = stravaId(txt) ? "Link Strava ricevuto: tocca «Scarica FC», poi «📂 Compila da file»." : "Link ricevuto. Tocca «Scarica FC».";
      return;
    }
    if(!res) return toast("Non ho ricevuto nessun file");
    await c.delete("shared-file");
    const text = await res.text();
    let r; try{ r = parseRunFile(text); }catch(err){ return toast(err.message || "File non riconosciuto"); }
    // c'è già una corsa registrata quel giorno senza grafici? la completo, altrimenti ne creo una nuova
    const same = S.log.filter(l => l.date===r.date);
    const target = same.find(l=>!l.track) || null;
    tab = "programma"; render();
    openLog(target, null, r);
    $("#importMsg").textContent += target ? " Collegato alla corsa che avevi già registrato quel giorno." : " Controlla la seduta proposta.";
  }catch(err){ toast("Errore nell'importazione"); }
})();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
