<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Corsa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f6f5; --card:#fff; --ink:#1b2422; --muted:#66736f; --line:#e2e7e5;
    --accent:#0f766e; --accent-soft:#e0f2ef; --warn:#b45309; --warn-soft:#fef3c7;
    --done:#15803d; --done-soft:#dcfce7; --danger:#b91c1c;
    --z1:#93c5fd; --z2:#4ade80; --z3:#facc15; --z4:#fb923c; --z5:#f87171;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1514; --card:#18211f; --ink:#e6ecea; --muted:#94a3a0; --line:#2a3633;
      --accent:#2dd4bf; --accent-soft:#11302c; --warn:#fbbf24; --warn-soft:#3a2c0b;
      --done:#4ade80; --done-soft:#123020; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:22px;letter-spacing:-.01em}
  header p{margin:2px 0 0;color:var(--muted);font-size:14px}
  main{padding:14px 14px 110px;max-width:640px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 10px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button svg{width:24px;height:24px}
  nav button.on{color:var(--accent);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .sp{flex:1}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  h2{font-size:17px;margin:20px 4px 10px}
  h3{font-size:16px;margin:0}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.done{background:var(--done-soft);color:var(--done)}
  .week{margin-bottom:12px}
  .week > summary{list-style:none;cursor:pointer;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px}
  .week > summary::-webkit-details-marker{display:none}
  .week[open] > summary{border-radius:14px 14px 0 0}
  .week.now > summary{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .week .body{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--card)}
  .sess{padding:12px 14px;border-top:1px solid var(--line)}
  .sess:first-child{border-top:0}
  .sess .plan{margin:4px 0 6px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){button.btn.primary{color:#062b27}}
  button.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:8px 6px}
  button.btn.danger{color:var(--danger)}
  .fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  @media (prefers-color-scheme: dark){.fab{color:#062b27}}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
  .stat .v{font-size:22px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted)}
  .log .top{display:flex;align-items:baseline;gap:8px}
  .zone{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .zone:first-of-type{border-top:0}
  .zone .sw{width:12px;align-self:stretch;border-radius:4px}
  .zone .n{font-weight:700;width:28px}
  .zone .r{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog form{padding:18px}
  /* dettaglio corsa a tutto schermo */
  #runDlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;background:var(--bg)}
  .runhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
  #runBody{padding:12px 12px calc(env(safe-area-inset-bottom) + 24px);max-width:720px;margin:0 auto}
  #runBody .stats{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
  #runBody .stat .v{font-size:20px}
  #runBody .chart.big{padding:12px 10px}
  #runBody .chart.big svg{touch-action:pan-y}
  #runBody .chart text{font-size:11px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
  .zbar{display:flex;gap:2px;height:22px;margin:10px 0 8px}
  .zbar i{border-radius:5px;min-width:3px}
  .zrow{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
  .zrow > i{width:12px;height:12px;border-radius:3px;flex:none}
  .zrow.dim{opacity:.45}
  .zrow .zmin{width:58px;text-align:right;font-variant-numeric:tabular-nums}
  .zrow .zpc{width:40px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .ztrack{height:4px;background:var(--line);border-radius:2px;margin:4px 0 0 20px;overflow:hidden}
  .ztrack i{display:block;height:100%;border-radius:2px}
  dialog h3{margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  textarea{min-height:64px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
  .calc{margin-top:8px;font-size:14px;color:var(--accent);font-weight:600;min-height:20px}
  .scale{display:flex;gap:4px}
  .scale button{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;font-size:13px}
  .scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips button.none.on{background:var(--done);border-color:var(--done)}
  .painrow{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .painrow .row{margin-bottom:6px}
  .painrow .side button{padding:3px 10px;font-size:12px}
  .painrow .scale button{font-size:12px;padding:6px 0}
  .sub{font-size:12px;color:var(--muted);margin:6px 0 3px}
  .feel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .feel button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 8px;font:inherit;font-size:14px;font-weight:600}
  .feel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .feel button small{display:block;font-weight:400;font-size:12px;opacity:.8}
  .hipwarn{margin-top:8px;padding:10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;display:none}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .note{font-size:14px;color:var(--muted);margin:6px 0}
  /* calendario */
  .calhead{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
  .calhead h3{flex:1;text-align:center;text-transform:capitalize}
  .cal{display:grid;grid-template-columns:repeat(7,1fr) 40px;gap:3px}
  .cal .dh{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
  .cal .d{min-height:52px;border-radius:8px;padding:3px;font-size:12px;background:var(--card);border:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:2px;cursor:pointer}
  .cal .d.out{opacity:.4}
  .cal .d.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cal .d .num{font-weight:600}
  .cal .d .dots{display:flex;gap:2px;flex-wrap:wrap}
  .cal .dot{width:7px;height:7px;border-radius:50%;background:var(--done)}
  .cal .ev{font-size:10px;line-height:1.15;border-radius:4px;padding:1px 3px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ev-gara{background:#dc2626}.ev-test{background:#d97706}.ev-altro{background:#2563eb}
  .cal .wk{font-size:10px;text-align:center;display:flex;flex-direction:column;justify-content:center;border-radius:8px;color:var(--muted)}
  .ph-Costruzione,.ph-Base,.ph-Sviluppo,.ph-Specifico{background:var(--accent-soft)} .ph-Test,.ph-Gara,.ph-Affinamento{background:#fee2e2} .ph-Scarico{background:#dbeafe} .ph-Recupero,.ph-Ripresa{background:var(--warn-soft)}
  @media (prefers-color-scheme: dark){.ph-Scarico{background:#16263f}.ph-Test,.ph-Gara,.ph-Affinamento{background:#3b1717}}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .count{font-size:26px;font-weight:700;line-height:1.1}
  /* sedute colorate per tipo */
  .week .body{padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
  .sess.kind{border:1px solid var(--line);border-left:6px solid var(--kc);border-radius:12px;background:var(--card)}
  .sess.kind.isdone{background:color-mix(in srgb, var(--kc) 7%, var(--card))}
  .sess.addrow{border-top:0;padding:2px 4px}
  .ktag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--kc);white-space:nowrap}
  .kdots{display:flex;align-items:center;gap:5px;margin-top:5px}
  .kdot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--kc);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .kdot:not(.on){font-size:0}
  .kdot.on{background:var(--kc);font-size:12px;font-weight:700}
  .kdot.opt{border-style:dashed}
  /* come si fa / dizionario */
  .howto{margin-top:8px}
  .howto summary{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
  .gitem{font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
  .gitem:first-of-type{border-top:0}
  .gitem b{display:block;margin-bottom:2px}
  /* obiettivi */
  .stars{color:var(--line);white-space:nowrap;letter-spacing:1px}
  .stars b{font-weight:400;cursor:pointer}
  .stars b.on{color:#f59e0b}
  .goal.focus{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b inset}
  .goal.done{background:var(--done-soft);border-color:transparent}
  .gbar{height:7px;border-radius:4px;background:var(--line);margin:8px 0 6px;overflow:hidden}
  .gbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#f59e0b,#16a34a)}
  /* blocchi */
  .tl{position:relative;margin:4px 0 2px}
  .tl .bar{display:flex;gap:2px;height:30px}
  .tl .seg{border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer}
  .tl .now{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
  .tl .months{display:flex;position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:4px}
  .tl .months span{position:absolute;transform:translateX(-50%)}
  .blk{margin:18px 0 10px;padding:12px 14px;border-radius:14px;color:#fff}
  .blk h3{color:#fff}
  .blk .small{opacity:.9}
  .blk .prog{height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin-top:8px;overflow:hidden}
  .blk .prog i{display:block;height:100%;background:#fff;border-radius:3px}
  /* grafici */
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .cap{font-size:13px;color:var(--muted);min-height:18px;margin-top:4px}
  .chart text{fill:var(--muted);font-size:10px;font-family:inherit}
  .chart .grid{stroke:var(--line);stroke-width:1}
  .lg{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:2px 0 6px}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  /* coach */
  .prop{border-left:4px solid var(--accent)}
  .prop.warn{border-left-color:var(--warn)}
  .prop.stop{border-left-color:var(--danger)}
  .prop.good{border-left-color:var(--done)}
  .prop .why{font-size:14px;color:var(--muted);margin:4px 0 0}
  .prop .what{font-size:14px;margin:8px 0 0;padding:8px 10px;background:var(--bg);border-radius:8px}
  nav .badge{position:absolute;top:4px;margin-left:18px;background:var(--danger);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
  nav button{position:relative}
  ul.tips{margin:6px 0 0;padding-left:18px;font-size:14px}
  ul.tips li{margin:4px 0}
</style>
</head>
<body>
<header><h1 id="title">Programma</h1><p id="subtitle"></p></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Registra corsa">+</button>
<nav>
  <button data-tab="programma" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Programma</button>
  <button data-tab="diario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Diario</button>
  <button data-tab="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></svg>Calendario</button>
  <button data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.5-.8z"/></svg>Coach<span class="badge" id="coachBadge" hidden></span></button>
  <button data-tab="altro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Altro</button>
</nav>

<!-- Registra / modifica corsa -->
<dialog id="logDlg"><form method="dialog" id="logForm">
  <h3 id="logTitle">Registra corsa</h3>
  <div id="logPlan" class="note"></div>
  <button type="button" class="btn" id="importRun" style="width:100%">📂 Compila da file dell'orologio (.tcx / .gpx)</button>
  <div class="row" style="margin-top:6px;gap:6px"><input id="stravaLink" placeholder="🔗 link della corsa su Strava" style="flex:1"><button type="button" class="btn" id="stravaGo">Scarica FC</button></div>
  <div id="importMsg" class="small" style="margin-top:4px;color:var(--accent)"></div>
  <input type="file" id="runFile" accept=".tcx,.gpx,application/gpx+xml,application/vnd.garmin.tcx+xml,application/xml,text/xml" hidden>
  <div class="grid2">
    <div><label>Data</label><input type="date" name="date" required></div>
    <div><label>Tipo seduta</label><input name="type" list="types" placeholder="es. Facile"></div>
  </div>
  <label>Seduta del programma</label><select name="programId"></select>
  <datalist id="types"><option>Facile</option><option>Aerobico</option><option>Lungo</option><option>Qualità</option><option>Facile + allunghi</option><option>Camminata/corsa</option></datalist>
  <div class="grid3">
    <div><label>Distanza (km)</label><input name="km" type="number" step="0.01" min="0" inputmode="decimal"></div>
    <div><label>Durata (min)</label><input name="min" type="number" step="1" min="0" inputmode="numeric"></div>
    <div><label>+ secondi</label><input name="sec" type="number" step="1" min="0" max="59" inputmode="numeric"></div>
  </div>
  <div class="calc" id="paceCalc"></div>
  <div class="grid2">
    <div><label>FC media</label><input name="hrAvg" type="number" min="40" max="230" inputmode="numeric"></div>
    <div><label>FC max</label><input name="hrMax" type="number" min="40" max="230" inputmode="numeric"></div>
  </div>
  <details id="hrzBox" style="margin-top:10px"><summary class="small" style="color:var(--accent);font-weight:600">Tempo nelle zone FC (minuti, dall'app Huawei)</summary>
    <div class="small muted" style="margin:6px 0">I file esportati da Huawei non contengono la FC: copia qui i minuti per zona che vedi nell'app Health.</div>
    <div class="grid3" style="grid-template-columns:repeat(5,1fr)">
      <div><label>Z1</label><input name="hz1" type="number" min="0" step="1" inputmode="numeric"></div>
      <div><label>Z2</label><input name="hz2" type="number" min="0" step="1" inputmode="numeric"></div>
      <div><label>Z3</label><input name="hz3" type="number" min="0" step="1" inputmode="numeric"></div>
      <div><label>Z4</label><input name="hz4" type="number" min="0" step="1" inputmode="numeric"></div>
      <div><label>Z5</label><input name="hz5" type="number" min="0" step="1" inputmode="numeric"></div>
    </div></details>
  <label>Sforzo percepito (1 = facilissimo, 10 = massimo)</label>
  <div class="scale" data-scale="rpe" data-from="1"></div>
  <label>Dolori a fine allenamento</label>
  <div class="chips" id="painChips"></div>
  <div id="painRows"></div>
  <div class="hipwarn" id="hipWarn"></div>
  <label>Terreno / meteo</label><input name="terrain" placeholder="es. pianura, asfalto, freddo">
  <label>Note</label><textarea name="notes" placeholder="Sensazioni, cosa è andato bene o male…"></textarea>
  <input type="hidden" name="id">
  <div class="actions">
    <button class="btn primary" value="save">Salva</button>
    <button class="btn" value="cancel" formnovalidate>Annulla</button>
    <span class="sp"></span>
    <button class="btn ghost danger" value="delete" id="logDelete" formnovalidate>Elimina</button>
  </div>
</form></dialog>

<!-- Modifica seduta programma -->
<dialog id="progDlg"><form method="dialog" id="progForm">
  <h3 id="progTitle">Seduta del programma</h3>
  <div class="grid2">

    {n:"Z5", lo:b(.9), hi:hrMax, c:"var(--z5)", name:"Alta intensità", feel:"Non parli. Pochi minuti al massimo.", use:"Ripetute brevi e veloci. Non necessaria all'inizio."},
  ];
}
function zoneOf(hr){ if(!hr) return null; const z = zones(); for(let i=z.length-1;i>=0;i--) if(hr>=z[i].lo) return z[i]; return {n:"<Z1"}; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function logFor(pid){ return S.log.find(l => l.programId === pid); }
/* Dolori: ogni corsa ha pains = [{part:"Ginocchio dx", level:0-10, next:0-10|null}] (next = il giorno dopo) */
const BODY = ["Anca","Ginocchio","Polpaccio","Tibia","Caviglia","Piede","Tendine d'Achille","Coscia","Schiena","Altro"];
function painOf(l){ return Math.max(0, ...(l.pains||[]).map(p => Math.max(p.level||0, p.next||0))); }
function painsText(l){ return (l.pains||[]).map(p => `${p.part} ${p.level}${p.next!=null?"→"+p.next:""}`).join(", "); }
function painsByPart(logs){ const m = {}; logs.forEach(l => (l.pains||[]).forEach(p => { const v = Math.max(p.level||0,p.next||0); (m[p.part] ??= []).push({v, date:l.date}); })); return m; }

function eventsInWeek(start){ const end = addDays(start,6); return S.events.filter(e=>e.date>=start && e.date<=end); }
const EV_ICON = {gara:"🏁", test:"⏱️", altro:"📌"};

function weekStats(start){
  const end = addDays(start,6);
  const runs = S.log.filter(l => l.date>=start && l.date<=end);
  return {n:runs.length, km:runs.reduce((a,l)=>a+(Number(l.km)||0),0), sec:runs.reduce((a,l)=>a+totalSec(l),0)};
}

/* ============ SPIEGAZIONI: niente termini ambigui ============
   clarify() rende espliciti recuperi e passo degli allunghi in qualsiasi testo di seduta.
   GUIDE è il dizionario: ogni voce si attiva se il suo termine compare nella seduta. */
function clarify(s){
  return String(s||"")
    .replace(/(\d+)\s*×\s*20(?:″| sec)\s*(?:allunghi|progressivi)(?: rilassati| sciolti)?(?:\s*\(rec\. camminando\))?(?!\s*\(rec\. 1)/g, (m,n)=>`${n} × 20″ allunghi (rec. 1′ camminando)`)
    .replace(/\+\s*(\d+)\s+allunghi(?!\s*\()/g, (m,n)=>`+ ${n} × 20″ allunghi (rec. 1′ camminando)`);
}
function clarifyPace(pace, plan){
  if(!/allunghi/.test(plan||"")) return pace;
  if(/allunghi (sciolti|non sprint)/.test(pace||"")) return pace.replace(/allunghi (sciolti|non sprint)/, `allunghi ~${STRIDE}`);
  return /allunghi/.test(pace||"") ? pace : `${pace}; allunghi ~${STRIDE}`;
}
function guideEntries(date){
  const P = (date||today()) < BASE_END ? RB : R;
  return [
    {k:/facil/i, t:"Corsa facile", d:`Passo ${P.F}, in Z2. Test pratico: devi riuscire a parlare in frasi intere. Se ti sembra «troppo lento» è giusto così: è qui che costruisci il motore. In salita rallenta pure, conta lo sforzo, non il passo.`},
    {k:/allung/i, t:"Allunghi (20″)", d:`Brevi accelerazioni da 20 secondi, in piano, alla fine della corsa facile. Parti dal passo facile e accelera gradualmente: negli ultimi 5–10″ arrivi a circa ${STRIDE}, cioè l'85–90% della tua velocità massima. Non è uno sprint: devi sentirti veloce ma sciolto, con spalle rilassate e passi rapidi, e il respiro non va in affanno. Recupero: 1′ camminando (o corsa lentissima) finché il respiro torna normale, poi il successivo. Servono a migliorare tecnica ed economia di corsa, non a stancarti.`},
    {k:/camminand/i, t:"Recupero camminando", d:"Cammini a passo normale per il tempo indicato (es. 1′). Se non c'è un tempo scritto, è 1′. Non fermarti del tutto: camminare aiuta a recuperare prima."},
    {k:/jogging|corsa lentissima/i, t:"Recupero in jogging", d:`Corsa lentissima tra una ripetuta e l'altra, più lenta del tuo passo facile (anche 7:00/km o oltre va benissimo) per il tempo indicato (es. «rec. 2′ jogging» = 2 minuti). Se sei molto in affanno puoi camminare i primi 20–30″. Non fermarti: tenere le gambe in movimento fa parte dell'allenamento.`},
    {k:/riscaldamento/i, t:"Riscaldamento", d:`Corsa facile (${P.F}) per il tempo indicato, di solito 15′, che parte molto lenta e negli ultimi minuti si avvicina al passo facile più svelto. Prima delle ripetute puoi aggiungere 2–3 allunghi per «svegliare» le gambe.`},
    {k:/defaticamento/i, t:"Defaticamento", d:"10′ di corsa molto lenta (o camminata se serve) dopo la parte veloce. Aiuta a far scendere la FC con calma; non saltarlo."},
    {k:/soglia/i, t:"Soglia", d:`Passo ${P.S}. È «comodamente duro»: riesci a dire qualche parola ma non a chiacchierare. Dovresti poter fare ogni frazione senza rallentare alla fine: se l'ultima è molto più lenta della prima, sei partito troppo forte. È il lavoro che più fa scendere il tempo sulla mezza.`},
    {k:/1000 m|1600 m|3′ veloci|ripetut/i, t:"Ripetute", d:`Tratti più veloci della soglia (${P.V}, o il passo scritto nella seduta). Mantieni lo stesso passo in tutte: la prima non deve essere la più veloce. Il recupero indicato (es. «rec. 2′ jogging») va fatto tutto, corricchiando.`},
    {k:/ritmo mezza|\bRM\b/, t:"Ritmo mezza (RM)", d:`Il passo che vuoi tenere in gara: ${P.RM} (4:58/km = 1h45). Deve sembrare controllato, mai al limite: in gara lo terrai per 21 km. Serve ad abituare gambe e testa a quel passo.`},
    {k:/ritmo medio|medio/i, t:"Ritmo medio", d:`Passo ${P.M}: più deciso del facile ma ancora sotto controllo, riesci a parlare a frasi brevi. Usato nei finali dei lunghi.`},
    {k:/lungo/i, t:"Lungo", d:`L'uscita più lunga della settimana, a passo facile (${P.F}) salvo diversa indicazione. Conta la durata, non la velocità. Porta acqua se supera i 75–90′.`},
    {k:/×/i, t:"Come si legge «3 × 8′»", d:"«3 × 8′» = 3 volte 8 minuti. ′ = minuti, ″ = secondi. «rec.» = recupero tra una frazione e l'altra. Esempio: «3 × 8′ a soglia, rec. 2′ jogging» = 8′ a soglia, 2′ di corsa lentissima, 8′ a soglia, 2′ lentissima, 8′ a soglia."},
    {k:/test|gara/i, t:"Test e gare", d:"Riscaldamento completo, poi il massimo sforzo che riesci a tenere regolare fino alla fine. Parti un filo più piano di quanto vorresti: è meglio chiudere in crescendo che spegnersi. Annota tempo, FC media e FC max."},
  ];
}
function sessionGuide(p){
  const txt = `${p.session} ${p.plan} ${p.pace}`;
  return guideEntries(p.start).filter(g => g.k.test(txt));
}
function guideHtml(list){ return list.map(g=>`<div class="gitem"><b>${g.t}</b><div>${g.d}</div></div>`).join(""); }

/* ---- Tipo di seduta: colore e icona per riconoscerle a colpo d'occhio ---- */
const KINDS = {
  facile:  {n:"Facile",   i:"🟢", c:"#16a34a"},
  lungo:   {n:"Lungo",    i:"🔵", c:"#2563eb"},
  qualita: {n:"Qualità",  i:"🟠", c:"#ea580c"},
  test:    {n:"Test/gara",i:"🔴", c:"#dc2626"},
};
function sessKind(p){
  const t = (p.session||"")+" "+(p.plan||"");
  if(/test|gara|mezza maratona/i.test(p.session||"")) return KINDS.test;
  if(/lungo/i.test(p.session||"")) return KINDS.lungo;
  if(isQuality(p) && !/^facile|allunghi/i.test(p.session||"")) return KINDS.qualita;
  return KINDS.facile;
}
function focusLine(){
  const g = S.goals.filter(x=>!x.done).sort((a,b)=>b.prio-a.prio || (a.due||"9").localeCompare(b.due||"9"))[0]; if(!g) return "";
  const st = goalStatus(g);
  return `<div class="row small" data-newgoal-go style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><span>🎯</span><span class="sp">Focus: <b>${esc(goalTitle(g))}</b></span>${starsHtml(g.prio)}</div>
    ${g.type!=="libero"?`<div class="gbar" style="margin-top:4px"><i style="width:${st.pct}%"></i></div>`:""}`;
}
function kindLegend(){ return `<div class="legend" style="margin-top:8px">${Object.values(KINDS).map(k=>`<span><i style="background:${k.c}"></i>${k.n}</span>`).join("")}</div>`; }

/* ---- Blocchi / cicli ---- */
function blockOf(day){ return S.blocks.find(b => day>=b.start && day<=b.end) || null; }
function blockWeeks(b){ return weeksBetween(b.start, addDays(b.end,1)); }
function timelineHtml(){
  if(!S.blocks.length) return "";
  const a = S.blocks[0].start, z = addDays(S.blocks[S.blocks.length-1].end,1);
  const total = (parseD(z)-parseD(a))/864e5, pos = d => Math.max(0,Math.min(100,(parseD(d)-parseD(a))/864e5/total*100));
  const t = today(), cur = blockOf(t);
  let months = "", d = new Date(parseD(a).getFullYear(), parseD(a).getMonth()+1, 1);
  while(iso(d) < z){ months += `<span style="left:${pos(iso(d))}%">${MESI[d.getMonth()]}</span>`; d.setMonth(d.getMonth()+1); }
  return `<div class="card"><div class="row" style="margin-bottom:8px"><b class="sp">Il tuo percorso</b><span class="small muted">${cur?`ora: <b>${esc(cur.name)}</b>`:""}</span></div>
    <div class="tl"><div class="bar">${S.blocks.map(b=>`<div class="seg" data-goto="${b.id}" style="flex:${blockWeeks(b)};background:${b.color}" title="${esc(b.name)}">${blockWeeks(b)>=3?esc(b.name.split(" ")[0]):""}</div>`).join("")}</div>
    ${t>=a && t<z ? `<div class="now" style="left:calc(${pos(t)}% - 1px)"></div>`:""}
    <div class="months">${months}</div></div>
    <div class="small muted" style="margin-top:4px">${weeksBetween(mondayOf(t), mondayOf(addDays(z,-1)))} settimane alla gara · tocca un blocco per andarci</div>${focusLine()}${kindLegend()}</div>`;
}
function blockHeader(b){
  const n = blockWeeks(b), t = today();
  const passed = t < b.start ? 0 : t > b.end ? n : weeksBetween(b.start, mondayOf(t)) + 1;
  const st = t < b.start ? `inizia tra ${Math.ceil((parseD(b.start)-parseD(t))/864e5)} gg` : t > b.end ? "completato" : `settimana ${passed} di ${n}`;
  return `<div class="blk" id="blk-${b.id}" style="background:${b.color}"><div class="row"><h3 class="sp">${esc(b.name)}</h3><span class="small">${st}</span></div>
    <div class="small">${dayLabel(b.start)} – ${dayLabel(b.end)} · ${n} settiman${n===1?"a":"e"}</div>
    <div class="small" style="margin-top:4px">${esc(b.goal)}</div>
    <div class="prog"><i style="width:${Math.round(passed/n*100)}%"></i></div></div>`;
}

function renderProgram(){
  $("#title").textContent = "Programma";
  const now = mondayOf(today());
  const ws = weekStats(now);
  $("#subtitle").textContent = `Questa settimana: ${ws.n} uscit${ws.n===1?"a":"e"} · ${ws.km.toFixed(1)} km · ${fmtDur(ws.sec)}`;
  const weeks = {};
  S.program.forEach(p => (weeks[p.start] ??= []).push(p));
  const keys = Object.keys(weeks).sort();
  let html = topBanners() + timelineHtml();
  if(!keys.length) html += `<div class="empty">Nessuna seduta in programma.</div>`;
  let curBlock = null;
  keys.forEach(k => {
    const bl = blockOf(k);
    if(bl && bl !== curBlock){ curBlock = bl; html += blockHeader(bl); }
    const list = weeks[k], phase = list[0].phase;
    const done = list.filter(p => logFor(p.id)).length, req = list.filter(p=>!p.optional).length;
    const isNow = k===now, past = addDays(k,6) < today();
    html += `<details class="week ${isNow?"now":""}" ${isNow || (!past && k>now && k<=addDays(now,7)) ? "open":""}>
      <summary><div class="sp"><h3>${weekLabel(k)} ${isNow?'<span class="pill">questa settimana</span>':""}</h3>
      <div class="kdots">${list.map(p=>{ const kd = sessKind(p), dn = logFor(p.id); return `<span class="kdot ${dn?"on":""} ${p.optional?"opt":""}" style="--kc:${kd.c}" title="${esc(p.session)}">${dn?"✓":kd.i}</span>`; }).join("")}<span class="small muted" style="margin-left:4px">${esc(phase)}</span></div>
      ${eventsInWeek(k).map(e=>`<div class="small"><span class="ev ev-${e.kind}" style="color:#fff;border-radius:4px;padding:1px 6px">${EV_ICON[e.kind]} ${esc(e.title)}</span> ${dayLabel(e.date)}</div>`).join("")}</div>
      <span class="pill ${done>=req?"done":""}">${done}/${req}</span></summary><div class="body">
      ${S.weekly[k]?`<div class="sess small">Bilancio: <b>${FEEL[S.weekly[k].feel]}</b>${S.weekly[k].note?" · "+esc(S.weekly[k].note):""} <button class="btn ghost" data-week="${k}">modifica</button></div>`
        : (k<=now ? `<div class="sess"><button class="btn" data-week="${k}">Com'è andata questa settimana?</button></div>` : "")}`;
    list.forEach(p => {
      const l = logFor(p.id);
      const kd = sessKind(p);
      html += `<div class="sess kind ${l?"isdone":""}" style="--kc:${kd.c}"><div class="row"><span class="ktag">${kd.n}</span><b class="sp">${esc(p.session)}</b>
        ${p.optional?'<span class="pill">facoltativa</span>':""}
        ${p.hipGated?'<span class="pill warn" title="Solo se non hai dolori">se ok*</span>':""}
        ${l?'<span class="pill done">✓ fatto</span>':""}</div>
        <div class="plan">${esc(p.plan)}</div>
        <div class="meta"><span>Durata <b>${esc(p.duration)||"–"}</b></span><span>Passo <b>${esc(p.pace)||"–"}</b></span><span>FC <b>${esc(p.hr)||"–"}</b></span></div>
        ${l?`<div class="meta" style="margin-top:6px"><span>Fatto ${dayLabel(l.date)}</span><span><b>${l.km||"–"} km</b></span><span><b>${fmtDur(totalSec(l))}</b></span>${l.km&&totalSec(l)?`<span><b>${pace(totalSec(l),l.km)}</b></span>`:""}</div>`:""}
        <div class="actions">${l?`<button class="btn" data-run="${l.id}">Vedi corsa${l.track?" 📈":""}</button>`:`<button class="btn primary" data-do="${p.id}">Registra</button>`}
        <button class="btn ghost" data-editprog="${p.id}">Cambia il piano</button></div>
        ${sessionGuide(p).length?`<details class="howto"><summary>ℹ️ Come si fa</summary>${guideHtml(sessionGuide(p))}</details>`:""}</div>`;
    });
    html += `<div class="sess addrow"><button class="btn ghost" data-addprog="${k}">+ Aggiungi seduta a questa settimana</button></div></div></details>`;
  });
  html += `<button class="btn" data-addprog="${keys.length?addDays(keys[keys.length-1],7):now}" style="width:100%">+ Nuova settimana</button>`;
  $("#view").innerHTML = html;
}

/* ---- Grafici (SVG fatti a mano, funzionano offline) ---- */
const CH = {w:340, h:150, l:30, r:8, t:10, b:22};
function plannedMin(p){ const m = (p.duration||"").match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*min/); if(m) return m[2]?(+m[1]+ +m[2])/2:+m[1];
  const h = (p.duration||"").match(/(\d+)h\s*(\d+)?/); return h ? +h[1]*60+(+h[2]||0) : 0; }
function chartWrap(title, legend, svg, cap){ return `<div class="card chart"><b>${title}</b>${legend?`<div class="lg">${legend}</div>`:""}${svg}<div class="cap">${cap}</div></div>`; }
function niceMax(v){ const s=[10,20,30,40,60,80,100,120,150,200,250,300,400,500]; return s.find(x=>x>=v) || Math.ceil(v/100)*100; }

function chartVolume(){
  // ultime 8 settimane + 4 future: minuti fatti (pieno) vs previsti (contorno)
  const now = mondayOf(today()), weeks = []; for(let i=-7;i<=4;i++) weeks.push(addDays(now,7*i));
  const data = weeks.map(w => ({w, plan: sessionsOfWeek(w).filter(p=>!p.optional).reduce((a,p)=>a+plannedMin(p),0),
    done: S.log.filter(l=>l.date>=w && l.date<=addDays(w,6)).reduce((a,l)=>a+totalSec(l)/60,0), feel: S.weekly[w]?.feel}));
  const max = niceMax(Math.max(60, ...data.map(d=>Math.max(d.plan,d.done))));
  const {w,h,l,r,t,b} = CH, iw = w-l-r, ih = h-t-b, bw = iw/data.length, y = v => t+ih-(v/max)*ih;
  let g = [0,max/2,max].map(v=>`<line class="grid" x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("");
  data.forEach((d,i) => {
    const x = l+i*bw+3, bwi = bw-6, cur = d.w===now;
    if(d.plan) g += `<rect x="${x}" y="${y(d.plan)}" width="${bwi}" height="${t+ih-y(d.plan)}" rx="4" fill="none" stroke="var(--muted)" stroke-dasharray="3 2" stroke-width="1.2"/>`;
    if(d.done) g += `<rect x="${x+2}" y="${y(d.done)}" width="${bwi-4}" height="${t+ih-y(d.done)}" rx="4" fill="var(--accent)"/>`;
    if(cur || (i-7)%2===0 && Math.abs(i-7)>1) g += `<text x="${x+bwi/2}" y="${h-8}" text-anchor="middle" style="${cur?"font-weight:700;fill:var(--ink)":""}">${cur?"oggi":parseD(d.w).getDate()+"/"+(parseD(d.w).getMonth()+1)}</text>`;
    g += `<rect x="${l+i*bw}" y="${t}" width="${bw}" height="${ih+b}" fill="transparent" data-tip="Sett. ${weekLabel(d.w)}: ${Math.round(d.done)}′ fatti su ${Math.round(d.plan)}′ previsti${d.feel?" · "+FEEL[d.feel]:""}"/>`;
  });
  return chartWrap("Volume settimanale (minuti)", `<span><i style="background:var(--accent)"></i>fatti</span><span><i style="border:1.2px dashed var(--muted)"></i>previsti</span>`,
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Minuti di corsa per settimana, fatti e previsti">${g}</svg>`, "Tocca una settimana per i dettagli.");
}

function chartPace(){
  const runs = S.log.filter(l => isEasyLog(l) && l.km && totalSec(l)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-20);
  if(runs.length < 2) return chartWrap("Passo delle corse facili", "", "", "Servono almeno 2 corse facili con distanza e durata.");
  const pts = runs.map(l => ({l, p: totalSec(l)/l.km}));   // secondi al km
  let lo = Math.min(...pts.map(x=>x.p)), hi = Math.max(...pts.map(x=>x.p)); lo = Math.floor((lo-10)/15)*15; hi = Math.ceil((hi+10)/15)*15;
  const {w,h,l,r,t,b} = CH, iw = w-l-r, ih = h-t-b;
  const x = i => l + (pts.length===1?iw/2:i*iw/(pts.length-1)), y = p => t + (p-lo)/(hi-lo)*ih;   // più veloce = più in alto
  const fmt = p => `${Math.floor(p/60)}:${String(Math.round(p%60)).padStart(2,"0")}`;
  let g = [lo,(lo+hi)/2,hi].map(v=>`<line class="grid" x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-4}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join("");
  g += `<polyline points="${pts.map((q,i)=>`${x(i)},${y(q.p)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((q,i) => g += `<circle cx="${x(i)}" cy="${y(q.p)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    <circle cx="${x(i)}" cy="${y(q.p)}" r="14" fill="transparent" data-tip="${dayLabel(q.l.date)}: ${fmt(q.p)}/km${q.l.hrAvg?" · FC "+q.l.hrAvg:""}"/>`);
  g += `<text x="${l}" y="${h-8}">${dayLabel(runs[0].date)}</text><text x="${w-r}" y="${h-8}" text-anchor="end">${dayLabel(runs[runs.length-1].date)}</text>`;
  const rb = today() < BASE_END ? RB.F : R.F;
  return chartWrap("Passo delle corse facili (min/km)", "", `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Passo medio delle corse facili nel tempo">${g}</svg>`,
    `Più in alto = più veloce. Obiettivo nei facili: ${rb}. Se a parità di sforzo il passo migliora, stai migliorando.`);
}

function chartPain(){
  const since = addDays(today(),-55), runs = S.log.filter(l=>l.date>=since).sort((a,b)=>a.date.localeCompare(b.date));
  if(!runs.length) return "";
  const {w,l,r,t} = CH, h = 90, b = 20, iw = w-l-r, ih = h-t-b;
  const x = d => l + (parseD(d)-parseD(since))/864e5/55*iw, y = v => t+ih-(v/10)*ih;
  let g = [0,3,10].map(v=>`<line class="grid" x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" ${v===3?'stroke-dasharray="4 3"':""}/><text x="${l-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("");

/* ============ OBIETTIVI ============
   Tipi: "tempo" (distanza sotto un tempo), "distanza" (una corsa di almeno X km),
         "settimana" (almeno X km in una settimana), "libero" (lo segni tu).
   Priorità 1–5: decide l'ordine e qual è il «focus» del momento.
   Gli obiettivi misurabili si controllano da soli a ogni corsa salvata. */
const SEED_GOALS = [
  {id:"g1", type:"tempo", km:21.0975, sec:105*60, title:"Mezza maratona sotto 1h45", prio:5, due:"2027-04-04", note:"Obiettivo principale della primavera"},
  {id:"g2", type:"tempo", km:10,      sec:45*60,  title:"10 km sotto 45′",          prio:4, due:"2027-03-07", note:""},
  {id:"g3", type:"tempo", km:5,       sec:20*60,  title:"5 km sotto 20′",           prio:2, due:"",           note:"Più a lungo termine"},
];
const DISTS = [{k:1,n:"1 km"},{k:5,n:"5 km"},{k:10,n:"10 km"},{k:15,n:"15 km"},{k:21.0975,n:"Mezza"},{k:42.195,n:"Maratona"}];
const distName = k => (DISTS.find(d=>Math.abs(d.k-k)<0.01)?.n) || `${String(+k).replace(".",",")} km`;
function parseTime(s){ const p = String(s||"").trim().split(/[:.′'″"h ]+/).filter(Boolean).map(Number); if(!p.length || p.some(isNaN)) return null;
  return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : p[0]*60; }
function fmtTime(sec){ if(sec==null) return "–"; sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`; }
function goalTitle(g){
  if(g.type==="tempo") return `${distName(g.km)} sotto ${fmtTime(g.sec)}`;
  if(g.type==="distanza") return `Correre ${String(g.km).replace(".",",")} km in un'uscita`;
  if(g.type==="settimana") return `${String(g.km).replace(".",",")} km in una settimana`;
  return g.title || "Obiettivo";
}
// Miglior tempo su una distanza dentro una corsa (dal tracciato, oppure dalla corsa intera se la distanza coincide)
function bestEffort(l, km){
  const D = km*1000, tr = l.track; let best = null;
  if(tr && tr.d[tr.d.length-1] >= D*0.995){
    let j = 0;
    for(let i=0;i<tr.d.length;i++){
      if(tr.d[i] < D*0.995) continue;
      const target = tr.d[i]-D;
      while(j < i && tr.d[j+1] <= target) j++;
      let ts = tr.t[j];
      if(tr.d[j] < target && tr.d[j+1] > tr.d[j]) ts = tr.t[j] + (target-tr.d[j])/(tr.d[j+1]-tr.d[j])*(tr.t[j+1]-tr.t[j]);
      const dt = tr.t[i] - ts; if(dt > 0 && (best==null || dt < best)) best = dt;
    }
  }
  const tot = totalSec(l), m = (l.km||0)*1000;
  if(tot && m >= D*0.98 && m <= D*1.05){ const est = tot*D/m; if(best==null || est < best) best = est; }
  return best;
}
function goalStatus(g){   // {best, date, ok, pct, text}
  if(g.type==="tempo"){
    let best = null, date = null, logId = null;
    S.log.forEach(l => { const b = bestEffort(l, g.km); if(b!=null && (best==null || b<best)){ best = b; date = l.date; logId = l.id; } });
    const ok = best!=null && best <= g.sec;
    const gapKm = best!=null ? (best-g.sec)/g.km : null;
    if(best==null){   // nessuna corsa su questa distanza: stima con la formula di Riegel dalle uscite più veloci
      let est = null, from = null;
      S.log.forEach(l => { const m = (l.km||0)*1000, t = totalSec(l); if(m < 3000 || !t) return;
        const e = t*Math.pow(g.km*1000/m, 1.06); if(est==null || e < est){ est = e; from = l; } });
      if(est) return {best:null, ok:false, pct: Math.min(100, g.sec/est*100),
        text: `Stima dalle tue corse: <b>~${fmtTime(est)}</b> (da ${String(from.km).replace(".",",")} km del ${dayLabel(from.date)}; le corse facili la rendono prudente)`};
    }
    return {best, date, logId, ok, pct: best ? Math.min(100, g.sec/best*100) : 0,
      text: best==null ? "Nessuna corsa su questa distanza ancora" : ok ? `Fatto in ${fmtTime(best)}` :
        `Record: <b>${fmtTime(best)}</b> (${dayLabel(date)}) · mancano ${fmtTime(best-g.sec)}, cioè ${Math.round(gapKm)}″/km`};
  }
  if(g.type==="distanza"){
    const top = [...S.log].sort((a,b)=>(b.km||0)-(a.km||0))[0], best = top?.km || 0;
    return {best, date: top?.date, logId: top?.id, ok: best >= g.km, pct: Math.min(100, best/g.km*100),
      text: best ? `Uscita più lunga: <b>${String(best).replace(".",",")} km</b>${top?" ("+dayLabel(top.date)+")":""}` : "Nessuna corsa ancora"};
  }
  if(g.type==="settimana"){
    const weeks = {}; S.log.forEach(l => { const w = mondayOf(l.date); weeks[w] = (weeks[w]||0) + (+l.km||0); });
    const [w, best] = Object.entries(weeks).sort((a,b)=>b[1]-a[1])[0] || [null, 0];
    return {best, date: w ? addDays(w,6) : null, ok: best >= g.km, pct: Math.min(100, best/g.km*100),
      text: best ? `Settimana migliore: <b>${best.toFixed(1).replace(".",",")} km</b> (${weekLabel(w)})` : "Nessuna corsa ancora"};
  }
  return {ok:false, pct:0, text: g.note ? esc(g.note) : "Lo segni tu quando lo raggiungi"};
}
// Controlla gli obiettivi aperti; restituisce quelli appena raggiunti
function checkGoals(){
  const fresh = [];

    if(st.ok){ g.done = {date: st.date || today(), best: st.best ?? null, logId: st.logId || null}; fresh.push(g); } });
  return fresh;
}

  const g = {...(old||{}), id: id || "g"+uid(), type:t, km: t==="libero"?null:km, sec: t==="tempo"?sec:null,
    title: goalF.title.value.trim(), prio: +goalF.dataset.prio || 3, due: goalF.due.value, note: goalF.note.value.trim()};
  if(old && (old.type!==g.type || old.km!==g.km || old.sec!==g.sec)) delete g.done;   // obiettivo cambiato: si ricontrolla
  const i = S.goals.findIndex(x=>x.id===g.id); if(i>=0) S.goals[i] = g; else S.goals.push(g);
  const fresh = checkGoals(); save(); render(); toast("Obiettivo salvato"); celebrate(fresh);
});

/* ============ CALENDARIO ============ */
let calMonth = today().slice(0,7);   // "2026-11"
function weekInfo(start){
  const list = S.program.filter(p=>p.start===start);
  if(!list.length) return null;
  const req = list.filter(p=>!p.optional).length, linked = list.filter(p=>logFor(p.id)).length;
  const runs = S.log.filter(l=>l.date>=start && l.date<=addDays(start,6)).length;
  const done = Math.max(linked, Math.min(req, runs));   // conta anche le corse non collegate a una seduta
  return {phase:list[0].phase, req, done, n:list.length};
}
function lastProgramWeek(){ const s = S.program.map(p=>p.start).sort(); return s.length ? s[s.length-1] : null; }
function weeksBetween(a,b){ return Math.round((parseD(b)-parseD(a))/(7*864e5)); }

function renderCalendar(){
  $("#title").textContent = "Calendario";
  const t = today(), upcoming = S.events.filter(e=>e.date>=t).sort((a,b)=>a.date.localeCompare(b.date));
  const lastW = lastProgramWeek();
  $("#subtitle").textContent = lastW ? `Programma pianificato fino al ${dayLabel(addDays(lastW,6))}` : "Nessun programma";
  let html = "";
  // Prossimo evento: conto alla rovescia
  const shown = [upcoming.find(e=>e.kind==="gara"), upcoming[0]].filter((e,i,a)=>e && a.indexOf(e)===i)
    .sort((a,b)=>a.date.localeCompare(b.date));
  shown.forEach(e => {
    const days = Math.round((parseD(e.date)-parseD(t))/864e5);
    const wk = weeksBetween(mondayOf(t), mondayOf(e.date));
    const missing = lastW ? Math.max(0, weeksBetween(lastW, mondayOf(e.date))) : wk+1;
    html += `<div class="card" data-editev="${e.id}"><div class="small muted">${EV_ICON[e.kind]} Prossim${e.kind==="gara"?"a gara":e.kind==="test"?"o test":"o evento"}</div>
      <h3 style="margin:2px 0 6px">${esc(e.title)}</h3>
      <div class="row"><div><div class="count">${days===0?"Oggi!":days}</div><div class="small muted">${days===0?"":"giorni"}</div></div>
      <div><div class="count">${wk}</div><div class="small muted">settimane</div></div>
      <div class="sp small" style="text-align:right">${dayLabel(e.date)}<br>${missing>0?`<span class="pill warn">${missing} sett. da pianificare</span>`:`<span class="pill done">programma completo</span>`}</div></div></div>`;
  });
  if(!upcoming.length){
    html += `<div class="card note">Aggiungi una gara o un test toccando un giorno del calendario: vedrai il conto alla rovescia e quante settimane mancano da pianificare.</div>`;
  }
  // Griglia mensile
  const [y,m] = calMonth.split("-").map(Number);
  const first = iso(new Date(y,m-1,1)), start = mondayOf(first);
  const monthName = new Date(y,m-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  html += `<div class="card"><div class="calhead"><button class="btn" data-cal="-1">‹</button><h3>${monthName}</h3><button class="btn" data-cal="1">›</button></div>
    <div class="cal">${["L","M","M","G","V","S","D"].map(d=>`<div class="dh">${d}</div>`).join("")}<div class="dh">sett.</div>`;
  for(let w=0; w<6; w++){
    const ws = addDays(start, w*7);
    if(w>0 && ws.slice(0,7) > calMonth) break;
    const info = weekInfo(ws);
    for(let d=0; d<7; d++){
      const ds = addDays(ws,d), runs = S.log.filter(l=>l.date===ds), evs = S.events.filter(e=>e.date===ds);
      html += `<div class="d ${ds.slice(0,7)!==calMonth?"out":""} ${ds===t?"today":""} ${info?"ph-"+esc(info.phase):""}" data-day="${ds}">
        <span class="num">${parseD(ds).getDate()}</span>
        ${evs.map(e=>`<span class="ev ev-${e.kind}">${esc(e.title)}</span>`).join("")}
        <span class="dots">${runs.map(()=>`<span class="dot"></span>`).join("")}</span></div>`;
    }
    html += `<div class="wk ${info?"ph-"+esc(info.phase):""}">${info?`<b>${info.done}/${info.req}</b>${esc(info.phase.slice(0,5))}`:"–"}</div>`;
  }
  html += `</div><div class="legend"><span><i class="ph-Base"></i>Carico</span><span><i class="ph-Scarico"></i>Scarico</span><span><i class="ph-Test"></i>Test/gara</span><span><i class="ph-Recupero"></i>Recupero</span>
    <span><i style="background:var(--done);border-radius:50%"></i>corsa fatta</span><span><i class="ev-gara"></i>gara</span><span><i class="ev-test"></i>test</span></div></div>`;
  // Elenco eventi
  html += `<h2>Date importanti</h2>`;
  if(!S.events.length) html += `<div class="empty">Nessun evento. <button class="btn primary" data-newev="${t}">+ Aggiungi gara o test</button></div>`;
  else {
    html += [...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e => {
      const days = Math.round((parseD(e.date)-parseD(t))/864e5);
      return `<div class="card row" data-editev="${e.id}" style="${days<0?"opacity:.55":""}"><span class="ev ev-${e.kind}" style="padding:4px 6px;font-size:14px">${EV_ICON[e.kind]}</span>
        <div class="sp"><b>${esc(e.title)}</b><div class="small muted">${dayLabel(e.date)} ${parseD(e.date).getFullYear()}${e.notes?" · "+esc(e.notes):""}</div></div>
        <div class="small" style="text-align:right">${days<0?"passato":days===0?"oggi":`tra ${days} gg`}</div></div>`;
    }).join("");
    html += `<button class="btn" data-newev="${t}" style="width:100%">+ Aggiungi gara o test</button>`;
  }
  $("#view").innerHTML = html;
}

/* ============ COACH ============
   Il coach NON cambia niente da solo: legge il diario, applica regole prudenti
   e propone modifiche. Le applica solo se tocchi «Accetta». */
const isQuality = p => p && (p.hipGated || /qualit|ripetut|test|soglia/i.test(p.session));
function logsSince(d){ return S.log.filter(l=>l.date>=d && l.date<=today()); }
function isEasyLog(l){ const p = S.program.find(x=>x.id===l.programId); return p ? !isQuality(p) : !/qualit|ripetut|test|soglia|allung/i.test(l.type||""); }
// Moltiplica le durate in minuti (solo valori ≥15, per non toccare le ripetute "6 × 2 min")
function scaleText(s, f){
  const r = x => Math.max(15, Math.round(x*f/5)*5);
  return (s||"").replace(/(\d+)(?:\s*[–-]\s*(\d+))?(\s*min)/g, (m,a,b,u) => +a<15 ? m : (b ? `${r(+a)}–${r(+b)}${u}` : `${r(+a)}${u}`));
}
function scaleSession(p, f){ return {...p, plan: scaleText(p.plan,f), duration: scaleText(p.duration,f)}; }
function toEasy(p, label){ return {...p, session: label || "Facile (al posto della qualità)", plan:"30–35 min facili in Z2, pianeggiante", duration:"30–35 min", pace:"Conversazionale", hr:"Z2", hipGated:false}; }
function addReps(p){ return {...p, plan: p.plan.replace(/(\d+)\s*×/, (m,n)=> +n<10 ? `${+n+1} ×` : m)}; }
function sessionsOfWeek(start){ return S.program.filter(p=>p.start===start); }
function replaceSessions(list){ list.forEach(n => { const i = S.program.findIndex(p=>p.id===n.id); if(i>=0) S.program[i]=n; }); }

// Genera la settimana successiva all'ultima pianificata, seguendo lo schema del tuo programma:
// 2 settimane di costruzione (+10% sui facili, +1 ripetuta) e poi 1 di scarico (−20%, niente qualità).
function nextWeekDraft(hipOk){
  const starts = [...new Set(S.program.map(p=>p.start))].sort();
  const lastW = starts[starts.length-1], now = mondayOf(today());
  const ns = !lastW || lastW < now ? now : addDays(lastW,7);
  let build = 0; for(let i=starts.length-1;i>=0;i--){ if(!/scarico|test/i.test(sessionsOfWeek(starts[i])[0].phase)) build++; else break; }
  const lastBuild = [...starts].reverse().find(s => !/scarico|test|gara|affinamento/i.test(sessionsOfWeek(s)[0].phase));
  const base = lastBuild ? sessionsOfWeek(lastBuild) : [
    {session:"Facile",plan:"30 min facili",duration:"30 min",pace:"Conversazionale",hr:"Z2"},
    {session:"Aerobico",plan:"35 min facili",duration:"35 min",pace:"Non fissato",hr:"Z2"},
    {session:"Lungo",plan:"45 min facili",duration:"45 min",pace:"Non fissato",hr:"Z2"}];
  const scarico = build >= 2;
  const out = base.filter(p=>!p.optional).map(p => {
    let n = {...p, id:"p"+uid(), start:ns, phase: scarico ? "Scarico" : "Costruzione", optional:false};
    if(isQuality(p)){
      if(scarico) n = {...n, session:"Facile + allunghi", plan:"35 min facili + 4 × 20″ allunghi (rec. 1′ camminando), solo se senza dolori", duration:"35 min", pace:`Facile; allunghi ~${STRIDE}`, hr:"Z2/sensazioni", hipGated:true};
      else if(!hipOk) n = toEasy(n);
      else n = addReps(n);
    } else n = scaleSession(n, scarico ? 0.8 : 1.1);
    return n;
  });
  return {start: ns, scarico, sessions: out};
}

function coachProposals(){
  const P = [], t = today(), now = mondayOf(t), next = addDays(now,7), last = addDays(now,-7);
  const z2hi = zones()[1].hi;
  const l7 = logsSince(addDays(t,-6)), l14 = logsSince(addDays(t,-13)), l28 = logsSince(addDays(t,-27));
  const hip7 = Math.max(0, ...l7.map(painOf)), hip14 = Math.max(0, ...l14.map(painOf));   // dolore massimo (qualsiasi parte)
  const pendingQuality = [...sessionsOfWeek(now), ...sessionsOfWeek(next)].filter(p=>p.hipGated && !logFor(p.id));
  const add = o => { if(!(o.key in S.dismissed)) P.push(o); };
  const byPart14 = painsByPart(l14), byPart7 = painsByPart(l7);

  // 1) DOLORI
  Object.entries(byPart14).forEach(([part, arr]) => {
    const high = arr.filter(x=>x.v>=4).length;
    if(high >= 2) add({key:"painstop-"+part+"-"+now, level:"stop", title:`${esc(part)}: fermati e fatti valutare`,
      why:`Nelle ultime 2 settimane il dolore a ${esc(part.toLowerCase())} è arrivato a 4 o più in ${high} uscite.`,
      what:"Sospendi la corsa e chiedi una valutazione a un medico o fisioterapista prima di riprendere. Il programma resta com'è.", label:"Ho capito", apply:()=>{}});
  });
  const hot7 = Object.entries(byPart7).map(([part,arr])=>({part, v:Math.max(...arr.map(x=>x.v))})).filter(x=>x.v>=3).sort((a,b)=>b.v-a.v);
  if(hot7.length && pendingQuality.length) add({key:"pain-"+now, level:"warn", title: hot7[0].v>=4 ? "Dolore alto: niente qualità" : "Dolore presente: togli la qualità",
    why:`Negli ultimi 7 giorni: ${hot7.map(x=>`${esc(x.part)} ${x.v}/10`).join(", ")}. Le sedute con l'asterisco si fanno solo con dolori a 0–2.`,
    what:`Sostituisco ${pendingQuality.length} sedut${pendingQuality.length===1?"a":"e"} (${pendingQuality.map(p=>esc(p.session)+" "+weekLabel(p.start)).join(", ")}) con 30–35 min facili.`,
    label:"Accetta", apply:()=> replaceSessions(pendingQuality.map(p=>toEasy(p)))});
  // dolore piccolo ma ricorrente nello stesso punto → alleggerisci il lungo
  Object.entries(byPart14).forEach(([part, arr]) => {
    if(arr.length < 3 || arr.some(x=>x.v>=3)) return;
    const longs = sessionsOfWeek(next).filter(p=>/lungo/i.test(p.session) && !logFor(p.id));
    add({key:"painrec-"+part+"-"+now, level:"warn", title:`${esc(part)}: fastidio ricorrente`,
      why:`Fastidio lieve a ${esc(part.toLowerCase())} in ${arr.length} uscite delle ultime 2 settimane. Da solo non preoccupa, ma un fastidio che torna sempre nello stesso punto va ascoltato.`,
      what: longs.length ? "Accorcio del 10% il lungo della settimana prossima. Controlla scarpe e superfici; se sale a 3 o più, togliamo la qualità." : "Controlla scarpe e superfici. Se sale a 3 o più, togliamo la qualità.",
      label: longs.length ? "Accetta" : "Ho capito", apply:()=> replaceSessions(longs.map(p=>scaleSession(p,0.9)))});
  });

  // 1b) BILANCIO SETTIMANALE
  const wNow = S.weekly[now], wLast = S.weekly[last], wPrev = S.weekly[addDays(last,-7)];
  const rated = wNow ? {start:now, ...wNow, before:wLast} : wLast ? {start:last, ...wLast, before:wPrev} : null;
  if(rated){
    const tgt = addDays(rated.start, 7), tgtList = sessionsOfWeek(tgt).filter(p=>!logFor(p.id));
    const lab = weekLabel(tgt);
    if(rated.feel==="troppo" && tgtList.length) add({key:"feel-troppo-"+rated.start, level:"warn", title:"Settimana troppo pesante: alleggeriamo",
      why:`Hai segnato la settimana ${weekLabel(rated.start)} come troppo pesante${rated.note?` («${esc(rated.note)}»)`:""}. Meglio scaricare ora che accumulare fatica.`,
      what:`Settimana ${lab}: facili e lungo −15%, una ripetuta in meno nella qualità.`,
      label:"Accetta", apply:()=> replaceSessions(tgtList.map(p => isQuality(p) ? {...p, plan:p.plan.replace(/(\d+)\s*×/, (m,n)=>`${Math.max(2,n-1)} ×`)} : scaleSession(p,0.85)))});
    else if(rated.feel==="pesante" && rated.before?.feel && ["pesante","troppo"].includes(rated.before.feel) && tgtList.length) add({key:"feel-pesante2-"+rated.start, level:"warn", title:"Due settimane pesanti di fila",
      why:"La fatica si sta accumulando: è il momento di togliere un po' di carico prima che diventi un problema.",
      what:`Settimana ${lab}: facili e lungo −10%.`, label:"Accetta", apply:()=> replaceSessions(tgtList.map(p => isQuality(p) ? p : scaleSession(p,0.9)))});
    else if(rated.feel==="pesante") add({key:"feel-pesante-"+rated.start, level:"info", title:"Settimana un po' pesante",
      why:"Normale ogni tanto, soprattutto nelle settimane di carico. Dormi bene e tieni davvero lenti i facili.",
      what:"Non cambio niente per ora. Se anche la prossima è pesante, ti propongo di alleggerire.", label:"Ho capito", apply:()=>{}});
    else if(rated.feel==="leggera" && rated.before?.feel==="leggera" && hip14<=2 && tgtList.length) add({key:"feel-leggera2-"+rated.start, level:"info", title:"Due settimane leggere: un piccolo passo in più",
      why:"Ti senti fresco da due settimane e senza dolori. Si può aumentare un po' il volume, non i ritmi.",
      what:`Settimana ${lab}: facili e lungo +8%. Ritmi invariati: la tentazione di correre più forte è il modo più veloce per farsi male.`,
      label:"Accetta", apply:()=> replaceSessions(tgtList.map(p => isQuality(p) ? p : scaleSession(p,1.08)))});
  }

  // 2) FACILI TROPPO DURI
  const hardEasy = l14.filter(l => isEasyLog(l) && ((l.rpe??0)>=6 || (l.hrAvg??0) > z2hi+3));
  const nextNonQ = sessionsOfWeek(next).filter(p=>!isQuality(p) && !logFor(p.id));
  if(hardEasy.length >= 2) add({key:"hardeasy-"+now, level:"warn", title:"Le corse facili non sono facili",
    why:`${hardEasy.length} corse facili nelle ultime 2 settimane con sforzo ≥6 o FC media sopra la Z2 (${z2hi} bpm).`,
    what: nextNonQ.length ? `Riduco del 10% la durata delle corse facili della settimana prossima, e rallenta: devi riuscire a parlare.` : "Rallenta nelle prossime uscite facili: devi riuscire a parlare in frasi intere. Camminare un minuto va benissimo.",
    label: nextNonQ.length ? "Accetta" : "Ho capito", apply:()=> replaceSessions(nextNonQ.map(p=>scaleSession(p,0.9)))});

  // 3) SETTIMANA SCORSA SALTATA IN BUONA PARTE → ripeti il carico invece di progredire
  const lw = weekInfo(last), lwRuns = S.log.filter(l=>l.date>=last && l.date<=addDays(last,6)).length;
  if(lw && lw.req >= 2 && lwRuns <= lw.req-2 && S.program.some(p=>p.start>=now))
    add({key:"repeat-"+last, level:"info", title:"Settimana scorsa: poche uscite",
      why:`Hai fatto ${lwRuns} uscit${lwRuns===1?"a":"e"} su ${lw.req} previste (${weekLabel(last)}). Le sedute saltate non si recuperano, e progredire ora sarebbe un salto.`,
      what:"Ripeto questa settimana le sedute della settimana scorsa e sposto tutto il resto del programma avanti di 7 giorni.",
      label:"Accetta", apply:()=>{
        S.program.forEach(p=>{ if(p.start>=now) p.start = addDays(p.start,7); });
        sessionsOfWeek(last).forEach(p=> S.program.push({...p, id:"p"+uid(), start:now}));
        S.program.sort((a,b)=>a.start.localeCompare(b.start));
      }});

  // 4) PROGRAMMA IN ESAURIMENTO → proponi la settimana successiva
  const futureWeeks = new Set(S.program.filter(p=>p.start>now).map(p=>p.start)).size;
  const nextEv = S.events.filter(e=>e.date>=t && e.kind==="gara").sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(futureWeeks <= 1 && !P.some(p=>p.level==="stop")){
    const d = nextWeekDraft(hip14 <= 2);
    add({key:"plan-"+d.start, level:"info", title:`Pianifica la settimana ${weekLabel(d.start)}`,
      why:`Il programma ha ${futureWeeks===0?"nessuna settimana":"una sola settimana"} dopo questa.${nextEv?` Mancano ${weeksBetween(now, mondayOf(nextEv.date))} settimane a «${esc(nextEv.title)}».`:""} ${d.scarico?"Dopo due settimane di carico tocca uno scarico.":"Proposta: +10% sui facili, +1 ripetuta sulla qualità."}${hip14>2?" Ci sono ancora dolori: niente qualità.":""}`,
      what: d.sessions.map(s=>`<b>${esc(s.session)}</b>: ${esc(s.plan)}`).join("<br>") + `<br><span class="small muted">Dopo averla aggiunta puoi modificare ogni seduta.</span>`,
      label:"Aggiungi al programma", apply:()=>{ S.program.push(...d.sessions); S.program.sort((a,b)=>a.start.localeCompare(b.start)); }});
  }

  // 5) GARA VICINA → scarico pre-gara (tapering)
  S.events.filter(e=>e.kind==="gara").forEach(e => {
    const days = Math.round((parseD(e.date)-parseD(t))/864e5);
    if(days < 3 || days > 21) return;
    const wb = addDays(mondayOf(e.date),-7), wr = mondayOf(e.date);
    const before = sessionsOfWeek(wb).filter(p=>!logFor(p.id) && p.start>=now), race = sessionsOfWeek(wr).filter(p=>!logFor(p.id));
    if(!before.length && !race.length) return;
    if(sessionsOfWeek(wr).some(p=>/gara|affinamento/i.test(p.phase))) return;   // scarico già nel programma
    add({key:"taper-"+e.id, level:"info", title:`Scarico pre-gara: ${esc(e.title)}`,
      why:`La gara è tra ${days} giorni. Arrivarci riposati conta più dell'ultimo allenamento.`,
      what:"Settimana prima della gara: facili −30%, qualità più corta. Settimana della gara: facili −40% e niente qualità (solo allunghi).",
      label:"Accetta", apply:()=>{
        replaceSessions(before.map(p => isQuality(p) ? {...p, plan: p.plan.replace(/(\d+)\s*×/, (m,n)=>`${Math.max(3,Math.ceil(n*0.6))} ×`)} : scaleSession(p,0.7)));
        replaceSessions(race.map(p => isQuality(p) ? toEasy(p,"Facile + allunghi pre-gara") : scaleSession(p,0.6)));
      }});
  });

  // 6) TEST
  if(!S.settings.restMeasured) add({key:"resthr", level:"info", title:"Test: misura la FC a riposo",
    why:`Le zone usano ${S.settings.hrRest} bpm come FC a riposo, un valore stimato. Misurarla rende le zone più giuste.`,
    what:"Per 3 mattine, appena sveglio e ancora sdraiato, guarda la FC per un minuto. Poi inserisci la media.",
    label:"Inserisci valore", apply:()=>{ const v = +prompt("FC a riposo media (bpm):", S.settings.hrRest); if(v>30 && v<110){ S.settings.hrRest = v; S.settings.restMeasured = true; } else throw "skip"; }});
  const maxSeen = Math.max(0, ...S.log.map(l=>l.hrMax||0));
  if(maxSeen > S.settings.hrMax) add({key:"hrmax-"+maxSeen, level:"info", title:`FC max registrata: ${maxSeen} bpm`,
    why:`In una corsa hai raggiunto ${maxSeen} bpm, più della FC max impostata (${S.settings.hrMax}). Se il dato è affidabile (fascia toracica, non picco anomalo), le zone vanno aggiornate.`,
    what:`Imposto FC max a ${maxSeen} e ricalcolo le zone.`, label:"Accetta", apply:()=>{ S.settings.hrMax = maxSeen; }});
  const activeWeeks = [0,1,2,3].filter(i => { const w = addDays(now,-7*(i+1)); return S.log.filter(l=>l.date>=w && l.date<=addDays(w,6)).length >= 2; }).length;
  const recentTest = S.log.some(l=>/test/i.test(l.type||"") && l.date>=addDays(t,-42)) || S.program.some(p=>/test/i.test(p.session) && p.start>=now);
  if(activeWeeks >= 3 && hip14 <= 2 && !recentTest){
    const q = sessionsOfWeek(next).find(p=>isQuality(p) && !logFor(p.id));
    add({key:"test30-"+now, level:"info", title:"Test: 30 minuti di soglia",
      why:"Hai almeno 3 delle ultime 4 settimane con 2+ uscite e senza dolori: è un buon momento per misurare i progressi e tarare i ritmi delle ripetute.",
      what:`15 min facili + <b>30 min al massimo sforzo regolare</b> che riesci a tenere + 10 min defaticamento. Annota passo medio e FC media degli ultimi 20 min. ${q?`Sostituisce «${esc(q.session)}» della settimana prossima.`:"Lo aggiungo alla settimana prossima."}`,
      label:"Aggiungi il test", apply:()=>{
        const test = {id: q?q.id:"p"+uid(), start: next, phase: q?q.phase:(sessionsOfWeek(next)[0]?.phase||"Costruzione"), session:"Test 30 min",
          plan:"15 min riscaldamento facile + 30 min al massimo sforzo regolare + 10 min defaticamento. Annota passo e FC media degli ultimi 20 min.",
          duration:"~55 min", pace:"Massimo sostenibile, regolare", hr:"Annota media ultimi 20 min", optional:false, hipGated:true};
        if(q) replaceSessions([test]); else S.program.push(test);
        S.program.sort((a,b)=>a.start.localeCompare(b.start));
      }});
  }

  // Tutto bene
  const lwDone = lw ? lwRuns >= lw.req : false;
  if(!P.length && S.log.length) P.push({key:"ok", level:"good", title:"Tutto in linea", why: `${hip7<=2?"Nessun dolore rilevante":"Qualche dolore da tenere d'occhio"}, ${lwDone?"settimana scorsa completata":"continua con le sedute in programma"}. Nessuna modifica da proporre.`});
  return P;
}

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}

async function exportJson(){
  const name = `corsa-backup-${today()}.json`, text = JSON.stringify(S,null,1);
  const done = () => { localStorage.setItem(KEY+"-lastbackup", new Date().toISOString()); render(); toast("Backup creato"); };
  try{
    const file = new File([text], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Backup corsa"}); return done();
    }

  download(name, text, "application/json"); done();

/* ---- Import da file dell'orologio (Huawei Health «Esporta percorso», Health Sync, condivisione) ----
   Dal file si ricavano: riepilogo (data, distanza, durata, FC), tempi per km e un tracciato
   sottocampionato (max ~300 punti) per i grafici della corsa. Il percorso GPS non viene salvato. */
function parseRunFile(text){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if(doc.querySelector("parsererror")) throw new Error("File non leggibile (serve un .tcx o .gpx)");
  const all = (root, n) => [...root.getElementsByTagNameNS("*", n)];
  const kid = (el, n) => el ? [...el.children].find(c => c.localName===n) : null;
  const num = el => el ? parseFloat(el.textContent) : NaN;
  // FC: nei file la chiamano in modi diversi (HeartRateBpm/Value, hr, heartrate, HeartRate…)
  const hrOf = el => { const c = [...el.getElementsByTagName("*")].find(x => /^(heartratebpm|hr|heartrate|heart_rate|heartratevalue)$/i.test(x.localName));
    if(!c) return NaN; const v = c.children.length ? num(c.getElementsByTagNameNS("*","Value")[0] || c.children[0]) : num(c); return v>30 && v<240 ? v : NaN; };
  let pts = [], lapSec = 0, lapM = 0;
  const laps = all(doc, "Lap");
  if(laps.length){                                    // ---- TCX
    laps.forEach(l => { lapSec += num(kid(l,"TotalTimeSeconds")) || 0; lapM += num(kid(l,"DistanceMeters")) || 0; });
    pts = all(doc, "Trackpoint").map(tp => ({ time: kid(tp,"Time")?.textContent, d: num(kid(tp,"DistanceMeters")),
      hr: hrOf(tp), alt: num(kid(tp,"AltitudeMeters")),
      lat: num(kid(kid(tp,"Position"),"LatitudeDegrees")), lon: num(kid(kid(tp,"Position"),"LongitudeDegrees")) }));
    if(!pts.length) pts = [{time: laps[0].getAttribute("StartTime") || all(doc,"Id")[0]?.textContent}];
  } else {                                            // ---- GPX
    pts = all(doc, "trkpt").map(p => ({ lat:+p.getAttribute("lat"), lon:+p.getAttribute("lon"),
      time: all(p,"time")[0]?.textContent, hr: hrOf(p), alt: num(all(p,"ele")[0]), d: NaN }));
    if(pts.length < 2) throw new Error("Nel file non c'è nessun tracciato");
  }
  // distanza cumulativa: dal file se c'è, altrimenti dal GPS
  const rad = x => x*Math.PI/180;
  let cum = 0;
  pts.forEach((p,i) => {
    if(!isNaN(p.d)){ cum = p.d; return; }
    if(i>0 && !isNaN(p.lat) && !isNaN(pts[i-1].lat)){
      const a = pts[i-1], dLat = rad(p.lat-a.lat), dLon = rad(p.lon-a.lon);
      const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(p.lat))*Math.sin(dLon/2)**2;
      cum += 2*6371000*Math.asin(Math.sqrt(h));
    }
    p.d = cum;
  });
  const t0 = pts[0].time ? new Date(pts[0].time).getTime() : NaN;
  pts.forEach(p => p.t = p.time ? (new Date(p.time).getTime()-t0)/1000 : NaN);
  const timed = pts.filter(p => !isNaN(p.t));
  const ext = n => num(all(doc, n)[0]);
  const fileM = lapM || ext("totalDistance") || 0, fileClimb = ext("CumulativeClimb") || ext("cumulativeClimb");
  // se il file dichiara la distanza ufficiale, riscalo quella calcolata dal GPS per farle coincidere
  const gpsM = timed.length ? timed[timed.length-1].d : 0;
  if(fileM && gpsM && Math.abs(fileM/gpsM-1) < 0.15) timed.forEach(p => p.d *= fileM/gpsM);
  if(!lapSec && ext("totalTime")) lapSec = ext("totalTime");
  const totalM = fileM || gpsM;
  const totalS = lapSec || (timed.length ? timed[timed.length-1].t : 0);
  if(!totalS && !totalM) throw new Error("Nel file non ci sono dati di corsa");
  let hrs = timed.map(p=>p.hr).filter(v=>v>0);
  const lapAvg = laps.length ? laps.map(l => num(kid(kid(l,"AverageHeartRateBpm"),"Value"))).filter(v=>v>0) : [];
  const lapMax = laps.length ? laps.map(l => num(kid(kid(l,"MaximumHeartRateBpm"),"Value"))).filter(v=>v>0) : [];

  // tempi per km (interpolati)
  const splits = [];
  if(timed.length > 2){
    let k = 1, prevT = 0, prevI = 0;
    for(let i=1;i<timed.length;i++){
      while(timed[i].d >= k*1000){
        const a = timed[i-1], b = timed[i], f = (k*1000-a.d)/((b.d-a.d)||1), tk = a.t + f*(b.t-a.t);
        const hrSeg = timed.slice(prevI, i+1).map(p=>p.hr).filter(v=>v>0);
        splits.push({km:k, sec: Math.round(tk-prevT), hr: hrSeg.length ? Math.round(hrSeg.reduce((x,y)=>x+y,0)/hrSeg.length) : null});
        prevT = tk; prevI = i; k++;
      }
    }
    const rest = totalM - (k-1)*1000;
    if(rest > 150){ const hrSeg = timed.slice(prevI).map(p=>p.hr).filter(v=>v>0);
      splits.push({km: Math.round(((k-1)*1000+rest)/10)/100, sec: Math.round(timed[timed.length-1].t - prevT), part: Math.round(rest), hr: hrSeg.length ? Math.round(hrSeg.reduce((x,y)=>x+y,0)/hrSeg.length) : null}); }
  }
  // tracciato sottocampionato per i grafici
  let track = null;
  if(timed.length > 10){
    const step = Math.max(1, Math.ceil(timed.length/300)), s = timed.filter((_,i)=>i%step===0 || i===timed.length-1);
    const r = (v, k=1) => isNaN(v) ? null : Math.round(v*k)/k;
    track = { t: s.map(p=>Math.round(p.t)), d: s.map(p=>Math.round(p.d)), hr: s.map(p=>r(p.hr)), alt: s.map(p=>r(p.alt,10)) };
    if(track.hr.every(v=>v==null)) delete track.hr;
    if(track.alt.every(v=>v==null)) delete track.alt;
  }
  const alts = timed.map(p=>p.alt).filter(v=>!isNaN(v));
  let gain = 0; for(let i=1;i<alts.length;i++){ const dd = alts[i]-alts[i-1]; if(dd>0) gain += dd; }
  return { date: pts[0].time ? iso(new Date(pts[0].time)) : null, km: totalM ? Math.round(totalM/10)/100 : null, sec: Math.round(totalS)||null,
    hrAvg: hrs.length ? Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length) : lapAvg.length ? Math.round(lapAvg.reduce((a,b)=>a+b,0)/lapAvg.length) : null,
    hrMax: hrs.length ? Math.max(...hrs) : lapMax.length ? Math.max(...lapMax) : null, noHrTrack: !hrs.length,
    gain: !isNaN(fileClimb) && fileClimb!=null ? Math.round(fileClimb) : alts.length ? Math.round(gain) : null, splits, track };
}
let pendingImport = null;   // dati del file in attesa di essere salvati con la corsa
function applyImport(r){
  pendingImport = r;
  // modulo nuovo ma quel giorno c'è già una corsa senza grafici? la completo invece di duplicarla
  if(!logF.id.value && r.date){
    // stessa data e senza grafici, oppure stessa data e distanza simile (±10%): è la stessa corsa
    const same = S.log.filter(l => l.date===r.date);
    const ex = same.find(l => !l.track) || (r.km ? same.find(l => l.km && Math.abs(l.km - r.km)/r.km < 0.1) : null);
    if(ex){ const keep = r; openLog(ex); pendingImport = keep; applyImport(keep);
      $("#importMsg").textContent += (ex.track ? " Aggiornata la corsa che avevi già importato quel giorno (sforzo e dolori restano)." : " Completata la corsa che avevi già registrato quel giorno."); return; }
  }
  if(r.date){ logF.date.value = r.date; fillSessionSelect(); }
  if(r.km) logF.km.value = r.km;
  if(r.sec){ logF.min.value = Math.floor(r.sec/60); logF.sec.value = r.sec%60; }
  if(r.hrAvg) logF.hrAvg.value = r.hrAvg;
  if(r.hrMax) logF.hrMax.value = r.hrMax;
  updPace();

/* Selettore della seduta del programma (le sedute della settimana della data scelta) */
function fillSessionSelect(keep){
  const sel = logF.programId, d = logF.date.value || today();
  const cur = keep !== undefined ? keep : sel.value;
  const wk = sessionsOfWeek(mondayOf(d)), curP = S.program.find(p=>p.id===cur);
  if(curP && !wk.includes(curP)) wk.unshift(curP);   // la seduta scelta resta, anche se la data è di un'altra settimana
  const myId = logF.id.value;
  sel.innerHTML = `<option value="">Corsa libera (fuori programma)</option>` + wk.map(p => {
    const taken = S.log.find(l => l.programId===p.id && l.id!==myId);
    return `<option value="${p.id}">${esc(p.session)}${p.start!==mondayOf(d)?" ("+weekLabel(p.start)+")":""}${taken?" · già registrata":""}</option>`; }).join("");
  sel.value = wk.some(p=>p.id===cur) ? cur : "";
}
function guessSession(date){   // prima seduta non ancora fatta di quella settimana (le facoltative per ultime)
  const wk = sessionsOfWeek(mondayOf(date)).filter(p => !logFor(p.id));
  return (wk.find(p=>!p.optional) || wk[0])?.id || "";
}
